<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Map attention comparison</title>
<style>body{font:16px system-ui;margin:24px;color:#182333;background:#f5f7fa}h1{font-size:24px}.controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:20px 0}.panels{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:white;padding:18px;border-radius:12px;min-width:0}canvas{width:100%;height:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto}.note{color:#526178;font-size:14px}button,select{padding:6px}input[type=range]{width:100%}@media(max-width:850px){.panels{grid-template-columns:1fr}}</style>
<h1 id="question"></h1>
<p class="note">Step maps are the direct elementwise sum of all 36 decoder-layer image-attention maps, captured during original autoregressive generation. The layer-max view instead takes each patch's maximum across those layers after complete inference.</p>
<div class="controls"><label>View <select id="mode"><option value="step">Single generation step: all-layer sum</option><option value="layermax_captured">Single generation step: max of captured layers, then normalized</option><option id="stepLayerMaxOption" value="layermax_step">Single generation step: max of all 36 layers, then normalized</option><option value="layermax">All layers: patch-wise max, then normalized</option><option value="above_mean_rate">All steps: fraction above each step's spatial mean</option><option value="above_median_rate">All steps: fraction above each step's spatial median</option><option value="mean">All steps: mean of all-layer sums</option><option value="p95">All steps: p95 over all-layer sums</option><option value="max">All steps: maximum all-layer sum</option><option value="stepnorm">All steps: each-step p99 normalized, then summed</option><option value="literal">All steps: literal sum of all-layer sums</option></select></label><label>Scale <select id="scale"><option value="p99" selected>Shared p99 contrast</option><option value="shared">Shared full range</option><option value="local">Local contrast</option></select></label><label>Mask opacity <input id="opacity" type="number" min="0" max="1" step="0.1" value="0.7"></label><button id="save">Export both maps as PNG</button></div>
<p id="legend" class="note"></p><div id="panels" class="panels"></div>
<script id="data" type="application/json">__PAYLOAD__</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent),records=data.records,$=id=>document.getElementById(id),image=new Image(),decode=s=>new Float32Array(Uint8Array.from(atob(s),c=>c.charCodeAt(0)).buffer);
$('question').textContent=records[0].question;
if(!data.has_step_layermax){const o=$('stepLayerMaxOption');o.disabled=true;o.textContent='Single generation step: patch-wise layer max (not captured for this run)'}
records.forEach((r,i)=>{r.steps=decode(r.all_layer_steps_f32);r.capturedLayerMax=decode(r.captured_layer_step_max_f32);r.stepLayerMax=data.has_step_layermax?decode(r.all_layer_step_max_f32):null;r.stepnorm=decode(r.step_p99_normalized_sum_f32);r.aboveMeanRate=decode(r.above_step_mean_rate_f32);r.aboveMedianRate=decode(r.above_step_median_rate_f32);r.layerMax=decode(r.layer_max_f32);const panel=document.createElement('section');panel.className='panel';panel.innerHTML=`<h2>${i===0?'Baseline':'Adapted'}</h2><canvas id="canvas${i}"></canvas><div id="stepBox${i}"><input id="step${i}" type="range" min="0" max="${r.all_layer_steps_shape[0]-1}" value="0"><p id="stepLabel${i}"></p><button id="play${i}">Play / pause</button><pre id="prefix${i}"></pre></div><button id="export${i}">Export map PNG</button><details><summary>Generated response</summary><pre>${r.text}</pre></details>`;$('panels').append(panel);$('step'+i).oninput=()=>draw(i);let timer=null;$('play'+i).onclick=()=>{if(timer){clearInterval(timer);timer=null;return}timer=setInterval(()=>{const s=$('step'+i);if(+s.value>=+s.max){clearInterval(timer);timer=null;return}s.value=+s.value+1;draw(i)},160)};$('export'+i).onclick=()=>download($('canvas'+i),`${r.variant}_all_layers_attention.png`)});
function download(canvas,name){const a=document.createElement('a');a.download=name;a.href=canvas.toDataURL('image/png');a.click()}
function mapFor(r,i){const mode=$('mode').value,[steps,gh,gw]=r.all_layer_steps_shape,n=gh*gw;if(mode==='step'||mode==='layermax_step'||mode==='layermax_captured'){const s=+$('step'+i).value,row=mode==='step'?r.steps.subarray(s*n,(s+1)*n):mode==='layermax_step'?r.stepLayerMax.subarray(s*n,(s+1)*n):r.capturedLayerMax.subarray(s*n,(s+1)*n);return {row,gh,gw,vmax:data.vmax[mode],label:`Step ${s+1}/${steps} predicting ${JSON.stringify(r.tokens[s])}`}}if(mode==='layermax')return {row:r.layerMax,gh,gw,vmax:data.vmax.layermax,label:'Patch-wise maximum across 36 complete-inference decoder-layer maps'};if(mode==='stepnorm')return {row:r.stepnorm,gh,gw,vmax:data.vmax.stepnorm,label:'Each step p99-normalized, then summed'};if(mode==='above_mean_rate')return {row:r.aboveMeanRate,gh,gw,vmax:data.vmax.above_mean_rate,label:"Fraction of steps above each step's spatial mean"};if(mode==='above_median_rate')return {row:r.aboveMedianRate,gh,gw,vmax:data.vmax.above_median_rate,label:"Fraction of steps above each step's spatial median"};const row=new Float32Array(n);for(let p=0;p<n;p++){const values=[];for(let s=0;s<steps;s++)values.push(r.steps[s*n+p]);if(mode==='mean')row[p]=values.reduce((a,b)=>a+b,0)/steps;else if(mode==='literal')row[p]=values.reduce((a,b)=>a+b,0);else{values.sort((a,b)=>a-b);const pos=.95*(steps-1),lo=Math.floor(pos),hi=Math.ceil(pos);row[p]=mode==='max'?values[steps-1]:values[lo]+(values[hi]-values[lo])*(pos-lo)}}const label=mode==='mean'?'Mean across all generated steps':mode==='literal'?'Literal sum across all generated steps':mode==='max'?'Maximum over generated steps':'95th percentile over generated steps';return {row,gh,gw,vmax:data.vmax[mode],label}}
function viridis(v){const stops=[[68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]],x=Math.max(0,Math.min(1,v))*(stops.length-1),i=Math.min(stops.length-2,Math.floor(x)),f=x-i;return stops[i].map((c,j)=>Math.round(c+(stops[i+1][j]-c)*f))}
function draw(i){const r=records[i],m=mapFor(r,i),mode=$('mode').value,scale=$('scale').value,local=scale==='local';let vmax=scale==='p99'?data.p99_vmax[mode]:m.vmax;if(local){vmax=1e-30;for(const v of m.row)vmax=Math.max(vmax,v)}const grid=document.createElement('canvas');grid.width=m.gw;grid.height=m.gh;const g=grid.getContext('2d'),pixels=g.createImageData(m.gw,m.gh),alpha=Math.max(0,Math.min(1,+$('opacity').value));for(let p=0;p<m.row.length;p++){const v=Math.min(1,m.row[p]/vmax),rgb=viridis(v);pixels.data.set([...rgb,Math.round(255*alpha*(.15+.85*v))],4*p)}g.putImageData(pixels,0,0);const canvas=$('canvas'+i);canvas.width=image.width;canvas.height=image.height;const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0);ctx.fillStyle='rgba(34,14,58,.20)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.imageSmoothingEnabled=false;ctx.drawImage(grid,0,0,canvas.width,canvas.height);const isStep=mode==='step'||mode==='layermax_step'||mode==='layermax_captured';$('stepBox'+i).hidden=!isStep;if(isStep){$('stepLabel'+i).textContent=m.label;const pre=$('prefix'+i);pre.textContent=r.tokens.slice(0,+$('step'+i).value).join('')}$('legend').textContent=`${m.label}; ${mode==='layermax'?'maximum over 36 complete-inference decoder-layer maps':mode==='layermax_step'?'maximum over 36 decoder-layer maps at this inference step':mode==='layermax_captured'?`maximum over captured layers ${r.settings.layers.join(', ')} at this inference step`:'direct sum of all 36 decoder layers and mean of all 32 query heads'}; ${scale==='p99'?`shared p99 normalization, clipped at ${vmax.toPrecision(4)}`:local?'local normalization':`shared full range 0 to ${vmax.toPrecision(4)}`}.`}
for(const id of ['mode','scale','opacity'])$(id).onchange=()=>records.forEach((r,i)=>draw(i));$('save').onclick=()=>{const a=$('canvas0'),b=$('canvas1'),c=document.createElement('canvas');c.width=a.width+b.width;c.height=Math.max(a.height,b.height);const ctx=c.getContext('2d');ctx.drawImage(a,0,0);ctx.drawImage(b,a.width,0);download(c,'attention_comparison.png')};image.onload=()=>records.forEach((r,i)=>draw(i));image.src=data.image;
</script></html>
