<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Map attention comparison</title>
<style>
body{font:16px system-ui;margin:24px;color:#182333;background:#f5f7fa}h1{font-size:24px}.controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:20px 0}.panels{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:white;padding:18px;border-radius:12px;min-width:0}canvas{width:100%;height:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto;font:14px/1.6 monospace}input[type=range]{width:100%}.note{color:#526178;font-size:14px}button,select{padding:6px}mark{background:#ffdc83}@media(max-width:850px){.panels{grid-template-columns:1fr}}
</style>
<h1 id="question"></h1>
<p class="note">Captured during actual generation. Frame t is decoder attention used to predict token t. Each map is the mean of all captured attention heads at one layer. The two model timelines are independent.</p>
<div class="controls"><label>Layer <select id="layer"></select></label><label>Head aggregation <strong id="headLabel"></strong></label><label>Scale <select id="scale"><option value="shared">Shared across models and steps</option><option value="local">Local contrast (not magnitude-comparable)</option></select></label><label>Overlay <input id="opacity" type="number" min="0" max="1" step="0.1" value="0.7"></label><button id="save">Export both current maps as PNG</button></div>
<p id="legend" class="note"></p><div id="panels" class="panels"></div>
<script id="data" type="application/json">__PAYLOAD__</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent),records=data.records,$=id=>document.getElementById(id),image=new Image();
$('question').textContent=records[0].question;$('headLabel').textContent=`Mean of ${records[0].heads.length} heads`;
records[0].layers.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v;$('layer').append(o)});$('layer').value=String(Math.max(0,records[0].layers.indexOf(16)));
records.forEach((r,i)=>{r.bytes=new Float32Array(Uint8Array.from(atob(r.display_f32),c=>c.charCodeAt(0)).buffer);const panel=document.createElement('section');panel.className='panel';panel.innerHTML=`<h2>${i===0?'Baseline':'Adapted'}</h2><canvas id="canvas${i}"></canvas><input id="step${i}" type="range" min="0" max="${r.display_shape[0]-1}" value="0"><p id="label${i}"></p><button id="play${i}">Play / pause</button> <button id="export${i}">Export map PNG</button><h3>Generated prefix</h3><pre id="prefix${i}"></pre><details><summary>Full response</summary><pre id="full${i}"></pre></details>`;$('panels').append(panel);$('full'+i).textContent=r.text;$('step'+i).oninput=()=>draw(i);let timer=null;$('play'+i).onclick=()=>{if(timer){clearInterval(timer);timer=null;return}timer=setInterval(()=>{const s=$('step'+i);if(+s.value>=+s.max){clearInterval(timer);timer=null;return}s.value=+s.value+1;draw(i)},160)};$('export'+i).onclick=()=>download($('canvas'+i),`${r.variant}_step${$('step'+i).value}.png`)});
function download(canvas,name){const a=document.createElement('a');a.download=name;a.href=canvas.toDataURL('image/png');a.click()}
function draw(i){const r=records[i],s=+$('step'+i).value,l=+$('layer').value,[steps,layers,gh,gw]=r.display_shape,n=gh*gw,start=(s*layers+l)*n,row=r.bytes.subarray(start,start+n);let denominator=data.vmax[l];const local=$('scale').value==='local';if(local){denominator=1e-30;for(const v of row)denominator=Math.max(denominator,v)}const grid=document.createElement('canvas');grid.width=gw;grid.height=gh;const g=grid.getContext('2d'),pixels=g.createImageData(gw,gh),alpha=Math.max(0,Math.min(1,+$('opacity').value));for(let p=0;p<n;p++){const v=Math.min(1,row[p]/denominator);pixels.data.set([255,Math.round(230*v),20,Math.round(255*alpha*v)],4*p)}g.putImageData(pixels,0,0);const canvas=$('canvas'+i);canvas.width=image.width;canvas.height=image.height;const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0);ctx.imageSmoothingEnabled=false;ctx.drawImage(grid,0,0,canvas.width,canvas.height);$('label'+i).textContent=`Step ${s+1}/${steps} · predicting ${JSON.stringify(r.tokens[s])} · ${r.status}`;const prefix=$('prefix'+i);prefix.textContent=r.tokens.slice(0,s).join('');const mark=document.createElement('mark');mark.textContent=r.tokens[s];prefix.append(mark);prefix.scrollTop=prefix.scrollHeight;$('legend').textContent=(local?'Local contrast: each frame has its own maximum; absolute magnitudes cannot be compared.':`Shared scale: 0 → ${denominator.toPrecision(4)} raw attention probability per image token.`)+` Showing layer ${r.layers[l]}, mean of ${r.heads.length} heads. Patch cells are not smoothed.`}
for(const id of ['layer','scale','opacity'])$(id).onchange=()=>records.forEach((r,i)=>draw(i));
$('save').onclick=()=>{const a=$('canvas0'),b=$('canvas1'),c=document.createElement('canvas');c.width=a.width+b.width;c.height=Math.max(a.height,b.height)+40;const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='black';ctx.font='20px sans-serif';ctx.fillText(`Baseline · step ${+$('step0').value+1}`,10,28);ctx.fillText(`Adapted · step ${+$('step1').value+1}`,a.width+10,28);ctx.drawImage(a,0,40);ctx.drawImage(b,a.width,40);download(c,'attention_comparison.png')};image.onload=()=>records.forEach((r,i)=>draw(i));image.src=data.image;
</script></html>
